# Carried over from Session 4: build + test on every push/PR, plus the dependency
# gate (Trivy). Session 5 ADDS a second workflow, security.yml (secret scanning in
# Lab 1, SAST in Lab 2) — students create it, it is intentionally not here yet.
name: ci
on: [push, pull_request]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test
      - run: npm run build

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Session 4 fix: pin the scanner EXACTLY (see CA-12 / the Trivy supply-chain
      # compromise). Trivy runs from its pinned official image, so the gate does not
      # depend on the trivy-action tag chain (which drifted upstream and broke CI).
      - name: Trivy dependency scan (fail on CRITICAL)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          docker run --rm -e GITHUB_TOKEN -v "$PWD:/src" aquasec/trivy:0.76.0
          fs --scanners vuln --severity CRITICAL --exit-code 1 /src
